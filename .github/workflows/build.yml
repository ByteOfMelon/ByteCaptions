# Builds ByteCaptions for Windows, macOS and Linux. Run it from the Actions tab; the
# installers are attached to the run.
name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        type: choice
        default: all
        options:
          - all
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
  push:
    tags: ['v*']

# A newer run replaces an older one still going on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # All platforms, or the one picked for a manual run.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          cat > all.json <<'JSON'
          [
            { "name": "Windows (x64)", "os": "windows-latest", "target": "x86_64-pc-windows-msvc", "ffmpeg": "win32-x64" },
            { "name": "macOS (Apple Silicon)", "os": "macos-latest", "target": "aarch64-apple-darwin", "ffmpeg": "darwin-arm64" },
            {
              "name": "macOS (Intel)", "os": "macos-15-intel", "target": "x86_64-apple-darwin", "ffmpeg": "darwin-x64",
              "ort-from-source": true,
              "tauri-args": "--config '{\"bundle\":{\"macOS\":{\"minimumSystemVersion\":\"14.0\"}}}'"
            },
            { "name": "Linux", "os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "ffmpeg": "linux-x64" }
          ]
          JSON
          echo "matrix=$(jq -c --arg t "$TARGET" '{include: map(select($t == "all" or .target == $t))}' all.json)" >> "$GITHUB_OUTPUT"

  # Intel Mac: ONNX Runtime is built from source below and needs macOS 14.
  # Linux: ubuntu-24.04 for glibc 2.38+, which ONNX Runtime needs.
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev cmake clang
          # GStreamer plays video in WebKitGTK; the AppImage bundles it.
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      # whisper.cpp's GPU backend on Windows is Vulkan; it needs the SDK's headers and shader
      # compiler to build. The app bundles only the loader (npm run fetch:vulkan).
      - name: Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.363.0 # same as the dev machine
          install_runtime: false
          cache: true
          stripdown: true

      # ort has no prebuilt ONNX Runtime for Intel Macs, so build the version it expects (CPU
      # only) and cache it. The build takes about 30 minutes.
      - name: ONNX Runtime cache
        if: matrix.ort-from-source
        id: ort-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/onnxruntime-lib
          key: onnxruntime-1.28.0-${{ matrix.target }}-macos14-v2

      - name: Build ONNX Runtime
        if: matrix.ort-from-source && steps.ort-cache.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          git clone --depth 1 --branch v1.28.0 --recurse-submodules --shallow-submodules https://github.com/microsoft/onnxruntime.git "$RUNNER_TEMP/onnxruntime"
          cd "$RUNNER_TEMP/onnxruntime"
          build="$RUNNER_TEMP/onnxruntime-build"
          # --apple_deploy_target is ignored for plain macOS builds; tell CMake instead.
          ./build.sh --config Release --build_dir "$build" --parallel --skip_tests \
            --compile_no_warning_as_error \
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF CMAKE_OSX_DEPLOYMENT_TARGET=14.0
          # re2 isn't built by default: nothing in a static build links against it.
          cmake --build "$build/Release" --target re2 --parallel
          # ort can't find the libraries in 1.28's build layout, but links a single
          # libonnxruntime.a as is. Tests, protoc and full protobuf aren't needed.
          find "$build/Release" -name '*.a' ! -name '*test*' ! -name '*gmock*' \
            ! -name '*benchmark*' ! -name 'libprotoc.a' ! -name 'libprotobuf.a' | sort > libs.txt
          cat libs.txt
          mkdir -p ~/onnxruntime-lib
          libtool -static -no_warning_for_no_symbols -o ~/onnxruntime-lib/libonnxruntime.a $(cat libs.txt)
          # Fail now, not in the app build, if anything is missing.
          echo 'const void *OrtGetApiBase(void); int main(void) { return OrtGetApiBase() == 0; }' > check.c
          clang check.c ~/onnxruntime-lib/libonnxruntime.a -lc++ -framework Foundation -o check
          ./check
          otool -l check | grep -A4 LC_BUILD_VERSION

      # Saved here, not at the end, so a failed app build still keeps it.
      - name: Save ONNX Runtime
        if: matrix.ort-from-source && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/onnxruntime-lib
          key: onnxruntime-1.28.0-${{ matrix.target }}-macos14-v2

      - name: Use the ONNX Runtime build
        if: matrix.ort-from-source
        run: |
          echo "ORT_LIB_LOCATION=$HOME/onnxruntime-lib" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci
      - run: npm run fetch:ffmpeg -- ${{ matrix.ffmpeg }}

      # The bundle needs DirectML.dll, which ort only downloads while it builds; build.rs copies
      # it to binaries/directml. On a clean checkout that happens after Tauri checks its
      # resources, so build once and put it in place by hand if it's still missing.
      - name: Windows extras
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run fetch:vulkan
          mkdir -p src-tauri/binaries/directml
          npm run build  # the Rust build checks that the web pages exist
          (cd src-tauri && cargo build --release --target ${{ matrix.target }} --features tauri/custom-protocol) || true
          dll=src-tauri/target/${{ matrix.target }}/release/DirectML.dll
          [ -f src-tauri/binaries/directml/DirectML.dll ] || cp "$dll" src-tauri/binaries/directml/

      - name: Build
        # Public builds have no Google sign-in client, so YouTube upload is off (BUILDING.md).
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }} ${{ matrix.tauri-args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ByteCaptions-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
