[package]
name = "app"
version = "0.1.0"
description = "Subtitle editor for YouTube"
authors = ["Michael Webb"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
whisper-rs = { version = "0.16", features = ["raw-api"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
sha2 = "0.10"
# YouTube sign-in (src/youtube.rs): PKCE codes, the loopback redirect, and the refresh token
# kept in the OS's secure storage.
base64 = "0.22"
getrandom = "0.3"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
url = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }

# Transcription on the GPU through Vulkan (any vendor), falling back to the CPU; see src/gpu.rs.
# Building needs the Vulkan SDK (VULKAN_SDK set by its installer).
[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16", features = ["raw-api", "vulkan"] }
