[package]
name = "app"
version = "0.9.2"
description = "Subtitle editor for YouTube"
authors = ["Michael Webb"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
whisper-rs = { version = "0.16", features = ["raw-api"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
sha2 = "0.10"
# YouTube sign-in (src/youtube.rs)
base64 = "0.22"
getrandom = "0.4"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
url = "2"
# Speaker separation (src/speakers.rs); vendored with GPL-safe maths, see vendor/speakrs/PATCHES.md
speakrs = { path = "vendor/speakrs" }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }

# Building needs the Vulkan SDK (VULKAN_SDK set by its installer)
[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16", features = ["raw-api", "vulkan"] }
speakrs = { path = "vendor/speakrs", features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["raw-api", "metal"] }

# Auto-update (src/update.rs)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
