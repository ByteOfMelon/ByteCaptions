# whisper.cpp build settings. Its bindings are generated with bindgen, which needs libclang
[env]
# Release builds must run on users' CPUs, not just the build machine's. AVX2 + FMA + F16C
# covers Intel Haswell (2013) / AMD Excavator (2015) and newer
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
# Windows build fixes for whisper.cpp; see the file
CMAKE_TOOLCHAIN_FILE = { value = "cmake/toolchain.cmake", relative = true }
