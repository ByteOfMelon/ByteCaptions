<bc-dialog heading="Project settings" [subtitle]="subtitle()">
	<bc-tabs class="on-panel" idPrefix="settings" [tabs]="tabs" [(value)]="tab" />

	<div
		class="panel"
		role="tabpanel"
		[id]="'settings-panel-' + tab()"
		[attr.aria-labelledby]="'settings-tab-' + tab()"
	>
		@switch (tab()) {
			@case ('general') {
				<bc-field label="Name" [error]="nameError()" #nameField>
					<input
						[id]="nameField.fieldId"
						[value]="name()"
						(input)="name.set($any($event.target).value)"
						spellcheck="false"
					/>
				</bc-field>
				<bc-select
					class="fps"
					label="Frame rate"
					[options]="fpsOptions()"
					[(value)]="fps"
				/>
				<div class="video-row">
					<bc-field class="video" label="Video" #videoField>
						<input
							[id]="videoField.fieldId"
							[value]="videoPath()"
							bcShowEnd
							placeholder="No video linked"
							readonly
							spellcheck="false"
						/>
					</bc-field>
					<button bcButton (click)="browse()"><svg lucideFolder></svg>Browse</button>
				</div>
			}
			@case ('rules') {
				<div class="rules">
					<bc-number-field
						label="Max characters per line"
						[min]="10"
						[max]="100"
						[(value)]="maxChars"
					/>
					<bc-number-field label="Max lines" [min]="1" [max]="5" [(value)]="maxLines" />
					<bc-number-field
						label="Max reading speed"
						suffix="cps"
						[min]="5"
						[max]="40"
						[(value)]="maxCps"
					/>
					<bc-number-field
						label="Min gap between cues"
						suffix="ms"
						[min]="0"
						[max]="1000"
						[step]="10"
						[(value)]="minGap"
					/>
					<bc-number-field
						label="Min duration"
						suffix="s"
						[min]="0.1"
						[max]="10"
						[step]="0.1"
						[error]="durationError()?.min ?? null"
						[(value)]="minDuration"
						(valueChange)="lastDuration.set('min')"
					/>
					<bc-number-field
						label="Max duration"
						suffix="s"
						[min]="1"
						[max]="30"
						[step]="0.5"
						[error]="durationError()?.max ?? null"
						[(value)]="maxDuration"
						(valueChange)="lastDuration.set('max')"
					/>
				</div>
				<span class="text-small text-faded"
					>Cues that break these rules show up in the Problems tab.</span
				>
			}
		}
	</div>

	<div dialogFooter>
		@if (tab() === 'rules') {
			<div class="footer-start">
				<button bcButton variant="ghost" [disabled]="isDefault()" (click)="resetRules()">
					Reset to defaults
				</button>
			</div>
		}
		<button bcButton (click)="ref.close()">Cancel</button>
		<button
			bcButton
			variant="primary"
			[disabled]="!!durationError() || !!nameError()"
			(click)="save()"
		>
			Save
		</button>
	</div>
</bc-dialog>
